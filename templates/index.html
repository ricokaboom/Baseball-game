<!DOCTYPE html>
<html>
<head>
    <title>Baseball Duel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background: black;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        canvas {
            display: block;
            margin: auto;
            background: #222;
        }
    </style>
</head>

<body>

<canvas id="gameCanvas" width="1600" height="800"></canvas>
<button onclick="leaveGame()"
        style="position:absolute; top:20px; left:20px; z-index:10;">
    Exit Game
</button>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<script>
    const ROOM_CODE = "{{ room_code }}";

    const MY_USERNAME = "{{ username }}";
    const MY_USER_ID = {{ session["user_id"] }};

    const PLAYER1_ID = {{ room.player1_id }};
    const PLAYER2_ID = {{ room.player2_id | tojson }};

    const PLAYER1_NAME = "{{ room.player1_name }}";
    const PLAYER2_NAME = {{ room.player2_name | tojson }};

    const gameReady = {{ game_ready | tojson }};
</script>

<script src="{{ url_for('static', filename='game.js') }}"></script>

</body>
</html>
